<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player">

        <h1>🎵 Music Player</h1>

        <!-- Song Image -->
        <img id="songImage" src="https://via.placeholder.com/250" alt="Song">

        <!-- Song Information -->
        <h2 id="songTitle">Song 1</h2>
        <p id="artist">Artist 1</p>

        <!-- Audio -->
        <audio id="audio"></audio>

        <!-- Progress -->
        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <input type="range" id="progress" value="0">

        <!-- Controls -->
        <div class="controls">

            <button onclick="previousSong()">⏮</button>

            <button onclick="playPause()" id="playBtn">
                ▶
            </button>

            <button onclick="nextSong()">⏭</button>

        </div>

        <!-- Volume -->
        <div class="volume">
            🔊
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>

        <!-- Playlist -->
        <h3>Playlist</h3>

        <div id="playlist"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
